    <main class="z-main">
      <div class="z-wrap">
        <div class="z-page-head">
          <h1>All tools</h1>
          <p class="z-page-head__sub">
            Every Zase tool in one place, grouped by category. Each one runs
            entirely in your browser: open a tool and start working, with
            nothing to install and nothing to upload.
          </p>
        </div>
        <div class="z-search z-search--page">
          <svg class="dt-icon z-search__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            id="z-search"
            type="search"
            placeholder="Search tools: try json, jwt, regex, color..."
            aria-label="Search tools"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="z-wrap" id="tools">
{{CATEGORY_SECTIONS}}
        <p class="z-no-results" id="z-no-results" style="display: none">
          No tool matches your search. Try a shorter word, for example json or color.
        </p>
      </div>
    </main>
