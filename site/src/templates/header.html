  <body>
    <header class="z-header">
      <div class="z-wrap z-header__inner">
        <a class="z-brand" href="{{PREFIX}}" aria-label="Zase home">
          <img src="{{PREFIX}}site/icon-96.png" alt="" width="34" height="34" />
          <span>Zase</span>
        </a>
        <nav class="z-nav" id="z-nav" aria-label="Main">
          <a class="z-btn z-btn--accent z-nav__cta" href="{{STORE_URL}}" target="_blank" rel="noopener">
            <img class="z-chrome-icon" src="{{PREFIX}}site/chrome.svg" alt="" width="16" height="16" />Add to Chrome
          </a>
          <a href="{{PREFIX}}"{{NAV_TOOLS}}>Tools</a>
          <a href="{{PREFIX}}about/"{{NAV_ABOUT}}>About</a>
          <a href="{{PREFIX}}contact/"{{NAV_CONTACT}}>Contact</a>
          <a href="{{PREFIX}}privacy/"{{NAV_PRIVACY}}>Privacy</a>
        </nav>
        <div class="z-header__actions">
          <button
            class="z-btn z-btn--icon z-theme-toggle"
            id="z-theme-toggle"
            type="button"
            aria-label="Switch to dark theme"
          >
            <svg class="dt-icon z-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="dt-icon z-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
          <a class="z-btn z-btn--accent z-header__cta" href="{{STORE_URL}}" target="_blank" rel="noopener">
            <img class="z-chrome-icon" src="{{PREFIX}}site/chrome.svg" alt="" width="16" height="16" />Add to Chrome
          </a>
          <button
            class="z-btn z-btn--icon z-menu-toggle"
            id="z-menu-toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="z-nav"
          >
            <svg class="dt-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </header>
