<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Developer Toolkit — Icon Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 720px; margin: auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p  { color: #666; margin: 0 0 24px; font-size: 14px; }
    .grid { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 24px; }
    .item { text-align: center; }
    .item canvas { display: block; border: 1px dashed #ddd; border-radius: 8px; image-rendering: pixelated; }
    .item span { display: block; margin-top: 6px; font-size: 12px; color: #666; }
    button { padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: #4f46e5; color: white; cursor: pointer; font-weight: 600; margin-right: 8px; }
    button.alt { background: #fff; color: #333; }
    button:hover { opacity: 0.9; }
    .note { margin-top: 20px; padding: 12px; background: #f6f7f9; border-radius: 8px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>Developer Toolkit — Icon Generator</h1>
  <p>Click each Download button to save the PNG into <code>assets/icons/</code>.</p>

  <div class="grid" id="grid"></div>

  <div>
    <button id="dlAll">Download all 4</button>
    <button id="dlAll" class="alt" onclick="location.reload()">Redraw</button>
  </div>

  <div class="note">
    Icon design: rounded square, indigo gradient background, white code brackets <code>&lt; &gt;</code>.
    Regenerate anytime. Delete this file after you've saved the PNGs.
  </div>

  <script>
    const SIZES = [16, 32, 48, 128];

    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;

      // Background gradient
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, '#6366f1');
      g.addColorStop(1, '#4f46e5');

      // Rounded square
      const r = size * 0.22;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.arcTo(size, 0, size, size, r);
      ctx.arcTo(size, size, 0, size, r);
      ctx.arcTo(0, size, 0, 0, r);
      ctx.arcTo(0, 0, size, 0, r);
      ctx.closePath();
      ctx.fill();

      // Code brackets
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(1.5, size / 12);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = size / 2;
      const cy = size / 2;
      const w  = size * 0.22;
      const h  = size * 0.30;

      // Left bracket <
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.35, cy - h);
      ctx.lineTo(cx - w * 1.15, cy);
      ctx.lineTo(cx - w * 0.35, cy + h);
      ctx.stroke();

      // Right bracket >
      ctx.beginPath();
      ctx.moveTo(cx + w * 0.35, cy - h);
      ctx.lineTo(cx + w * 1.15, cy);
      ctx.lineTo(cx + w * 0.35, cy + h);
      ctx.stroke();

      // Slash /
      ctx.beginPath();
      ctx.moveTo(cx + w * 0.15, cy - h * 1.1);
      ctx.lineTo(cx - w * 0.15, cy + h * 1.1);
      ctx.stroke();
    }

    const grid = document.getElementById('grid');
    const canvases = [];

    SIZES.forEach(size => {
      const wrap = document.createElement('div');
      wrap.className = 'item';

      const canvas = document.createElement('canvas');
      canvas.style.width  = (size >= 48 ? size : size * 2) + 'px';
      canvas.style.height = (size >= 48 ? size : size * 2) + 'px';
      drawIcon(canvas, size);

      const label = document.createElement('span');
      label.textContent = size + ' × ' + size;

      const btn = document.createElement('button');
      btn.textContent = 'Download';
      btn.style.marginTop = '8px';
      btn.onclick = () => download(canvas, 'icon' + size + '.png');

      wrap.appendChild(canvas);
      wrap.appendChild(label);
      wrap.appendChild(btn);
      grid.appendChild(wrap);

      canvases.push({ canvas, size });
    });

    function download(canvas, filename) {
      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }, 'image/png');
    }

    document.getElementById('dlAll').onclick = () => {
      canvases.forEach(({ canvas, size }) => download(canvas, 'icon' + size + '.png'));
    };
  </script>
</body>
</html>
