<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.28" cy="0.08" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="14" y="14" width="484" height="484" rx="114" fill="url(#tile)"/>
  <rect x="14" y="14" width="484" height="484" rx="114" fill="url(#shade)"/>
  <rect x="14" y="14" width="484" height="484" rx="114" fill="url(#gloss)"/>
  <rect x="15.5" y="15.5" width="481" height="481" rx="112.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Depth layer: the same mark, dropped and darkened, for a 3D lift -->
  <g transform="translate(0 13)" opacity="0.5" stroke="#1E1B4B" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 198 148 L 112 256 L 198 364" stroke-width="46"/>
    <path d="M 314 148 L 400 256 L 314 364" stroke-width="46"/>
    <path d="M 218 162 H 294 L 218 350 H 294" stroke-width="40"/>
  </g>

  <!-- Mark: the original code brackets, with a gold Z adjusted between them -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 198 148 L 112 256 L 198 364" stroke="url(#glyph)" stroke-width="46"/>
    <path d="M 314 148 L 400 256 L 314 364" stroke="url(#glyph)" stroke-width="46"/>
    <path d="M 218 162 H 294 L 218 350 H 294" stroke="url(#slash)" stroke-width="40"/>
  </g>
</svg>
